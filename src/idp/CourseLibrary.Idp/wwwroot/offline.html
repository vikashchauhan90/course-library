<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline - Course Library</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f4f7fb; }
        body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 1rem; }
        main { width: min(100%, 32rem); padding: 3rem 2rem; text-align: center; background: white; border: 1px solid #d9e2f0; border-radius: 1rem; box-shadow: 0 1.5rem 4rem rgba(23,32,51,.1); }
        .signal { color: #155eef; font-size: 4rem; font-weight: 800; line-height: 1; }
        h1 { margin: 1rem 0 .5rem; } p { color: #667085; line-height: 1.6; } a { display: inline-block; margin-top: 1rem; padding: .7rem 1rem; color: white; background: #155eef; border-radius: .45rem; text-decoration: none; }
    </style>
</head>
<body><main><div class="signal">~</div><h1>You are offline</h1><p>Course Library could not reach the network. Check your connection and try again.</p><a href="/">Try again</a></main></body>
</html>
